
name: build-and-push
on:
  workflow_dispatch:
  push:
    branches:
        - develop

permissions:
  contents: write
  
jobs:
  build_and_push:
    environment: dev
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
    steps:
      # checkout repo
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # setup docker buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # build and push
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: pdevfig/frontend-temp:${{ github.sha }}
          cache-from: type=registry,ref=pdevfig/frontend-temp:devcache
          cache-to: type=registry,ref=pdevfig/frontend-temp:devcache,mode=max

      # set image tag value
      - name: Set image tag value
        id: image
        run: echo "image_name=pdevfig/backend-temp:{{ github.sha }}" >> $GITHUB_OUTPUT

  update_helm:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      # checkout helm
      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: pdevfigorg2/ops
          ref: feature/helm-charts
          token: ${{ secrets.OPS_REPO_TOKEN }}
          path: ops
      
      # setup uv
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.13
      
      - name: Update image tag
        working-directory: ops
        run: uvx pdev-pj1-yaml-tool --frontend-image-tag-value ${{ github.sha }} --file ./project1/dev_values.yaml
      
      - name: Comit and push
        working-directory: ops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189882+github-actions[bot]@user.noreply.github.com"
          git add ./project1/dev_values.yaml

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "bot: Update frontend image tag to ${{ github.sha }}"
          git push

          echo "New image name ${{ needs.build_and_push.outputs.image_name }}" >> $GITHUB_STEP_SUMMARY
