name: Ephermal-env-upon-pr
on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    types:
      - closed 

permissions:
  contents: read 
  packages: write
  
jobs:
  delete_the_pr_file:
    # needs: build_and_push_pr
    runs-on: ubuntu-latest
    env:
      FILE_NAME: pr-${{ github.event.pull_request.number }}.yaml
    steps:
      # checkout helm
      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: pdevfigorg2/ops
          ref: learn/rollouts
          token: ${{ secrets.OPS_REPO_TOKEN }}
          path: ops
      
      - name: delete file
        working-directory: ops/project1
        run: |
          git rm "${{ env.FILE_NAME }}"

      - name: Comit and push
        working-directory: ops
        run: |
          ls project1
          git config user.name "github-actions[bot]"
          git config user.email "4189882+github-actions[bot]@user.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "bot: cleanup all the pr file pr ${{ github.event.pull_request.number}} closed."