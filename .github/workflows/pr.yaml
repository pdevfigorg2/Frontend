name: Ephermal-env-upon-pr
on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read 
  packages: write
  
jobs:
  build_and_push-pr:
    runs-on: ubuntu-latest
    steps:
      # checkout repo
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # setup docker buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # build and push
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: pdevfig/frontend-temp:pr-${{ github.event.pull_request.number }}
          cache-from: type=registry,ref=pdevfig/frontend-temp:devcache
          cache-to: type=registry,ref=pdevfig/frontend-temp:devcache,mode=max

      # set image tag value
      - name: Set image tag value
        run: echo "Image name pdevfig/frontend-temp:pr-{{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY

