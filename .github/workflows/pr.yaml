name: Ephermal-env-upon-pr
on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read 
  packages: write
  
jobs:
  build_and_push_pr:
    runs-on: ubuntu-latest
    steps:
      # checkout repo
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # setup docker buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # build and push
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: pdevfig/frontend-temp:pr-${{ github.event.pull_request.number }}--${{ github.event.pull_request.head.sha }}
          cache-from: type=registry,ref=pdevfig/frontend-temp:devcache
          cache-to: type=registry,ref=pdevfig/frontend-temp:devcache,mode=max

      # set image tag value
      - name: Set image tag value
        run: echo "Image name pdevfig/frontend-temp:pr-${{ github.event.pull_request.number }}--${{ github.event.pull_request.head.sha }}" >> $GITHUB_STEP_SUMMARY

  update_helm_with_new_pr_file:
    needs: build_and_push_pr
    runs-on: ubuntu-latest
    steps:
      # checkout helm
      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: pdevfigorg2/ops
          ref: learn/rollouts
          token: ${{ secrets.OPS_REPO_TOKEN }}
          path: ops
     
      - name: create env values
        run: |
          echo "FILE_NAME=pr-${{ github.event.pull_request.number }}.yaml" >> $GITHUB_ENV
          echo "PR_ENV=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: create and place values
        working-directory: ops/project1
        run: |
          cat << 'EOF' > "${{ env.FILE_NAME }}"
          # This file is generated automatically by Github Actions CI/CD
          env: ${{ env.PR_ENV }}
          frontend: 
            deployment: 
              imageName: 
                tag: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          EOF 

      - name: Comit and push
        working-directory: ops
        run: |
          ls project1
          git config user.name "github-actions[bot]"
          git config user.email "4189882+github-actions[bot]@user.noreply.github.com"
          git add ./project1/${FILE_NAME}

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "bot: Update frontend image tag to ${{ github.sha }}"
          git push

          echo "New image name pdevfig/frontend-temp: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}" >> $GITHUB_STEP_SUMMARY